{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "helix-web.fullname" . }}
  labels:
    {{- include "helix-web.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "helix-web.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  # A static site needs no outbound connections.
  egress: []
{{- end }}
