apiVersion: v1
kind: Pod
metadata:
  name: {{ include "helix-web.fullname" . }}-test
  labels:
    {{- include "helix-web.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37.0
      command: [sh, -c]
      args:
        - >-
          wget -qO- http://{{ include "helix-web.fullname" . }}:{{ .Values.service.port }}/healthz &&
          wget -qO /dev/null http://{{ include "helix-web.fullname" . }}:{{ .Values.service.port }}/
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
